spring.application.name=study-assistant-server
server.port=8787

# The real key lives in the project-root .env file (git-ignored) as
# GEMINI_API_KEY=... . The server is started from server/, hence "../.env".
spring.config.import=optional:file:../.env[.properties]

gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-3.5-flash-lite
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.timeout=20s
